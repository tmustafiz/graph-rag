name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so a CVE disclosed against an otherwise-unchanged image still trips
    # the `image` job (Mondays 07:00 UTC).
    - cron: "0 7 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --all-extras --dev
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Sync dependencies
        run: uv sync --all-extras --dev
      - name: Cache embedding model
        id: model-cache
        uses: actions/cache@v6
        with:
          path: models/all-MiniLM-L6-v2
          key: minilm-l6-v2-v1
      - name: Fetch embedding model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: make fetch-model
      - name: Run pytest
        # Model is on disk (fetched or restored from cache) — no network needed.
        env:
          HF_HUB_OFFLINE: "1"
        run: uv run pytest -q

  eval:
    name: Retrieval eval
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:2026.07.1
        env:
          NEO4J_AUTH: neo4j/testpassword
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 20
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: testpassword
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --all-extras --dev
      - name: Cache embedding model
        id: model-cache
        uses: actions/cache@v6
        with:
          path: models/all-MiniLM-L6-v2
          key: minilm-l6-v2-v1
      - name: Fetch embedding model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: make fetch-model
      - name: Apply schema and run retrieval eval
        run: |
          uv run graph-rag apply-schema
          uv run graph-rag eval-retrieval

  image:
    name: Image build & CVE scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: graph-rag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        # Pull the vuln DB from ECR, not GHCR, to dodge anonymous-pull rate limits.
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db
        with:
          image-ref: graph-rag:ci
          format: table
          severity: HIGH,CRITICAL
          # Only block on CVEs that actually have a fix — an unfixable base CVE
          # shouldn't wedge every PR. Flip to false to tighten.
          ignore-unfixed: true
          exit-code: "1"

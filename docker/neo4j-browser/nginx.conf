server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;

    # emit a relative Location so it works behind the published host port
    absolute_redirect off;

    # match how a real Neo4j server exposes the UI: / -> /browser/
    location = / { return 302 /browser/; }

    location /browser/ {
        try_files $uri $uri/ /browser/index.html;
    }
}

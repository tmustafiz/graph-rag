# Opt-in split-deployment stack: the knowledge base half, standalone.
#
# docker-compose.yml (the default quickstart) runs the knowledge base and
# agent memory together in one Neo4j + one MCP container. Run this alongside
# docker-compose.memory.yml — not docker-compose.yml — to deploy them
# independently instead: separate Neo4j, separate MCP server, no shared
# process. See docs/operations.md "Split deployment (optional)".
#
#   docker compose -f docker-compose.knowledge.yml up
#
# Same NEO4J_USER/NEO4J_PASSWORD/MCP_AUTH_TOKEN .env keys as docker-compose.yml
# — this stack's Neo4j is a separate instance, so the same credential names
# just provision it independently, not shared state.
name: graph-rag-knowledge

services:
  neo4j-knowledge:
    image: ${NEO4J_IMAGE:-neo4j:2026.07.1}
    container_name: graph-rag-neo4j-knowledge
    ports:
      - "127.0.0.1:7474:7474" # browser UI
      - "127.0.0.1:7687:7687" # bolt
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-changeme-local-dev}"
      NEO4J_PLUGINS: '${NEO4J_PLUGINS-["apoc", "graph-data-science"]}'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
    volumes:
      - neo4j_knowledge_data:/data
      - neo4j_knowledge_plugins:/var/lib/neo4j/plugins
    healthcheck:
      test:
        ["CMD", "cypher-shell", "-u", "${NEO4J_USER:-neo4j}",
         "-p", "${NEO4J_PASSWORD:-changeme-local-dev}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  mcp-knowledge:
    build:
      context: .
      target: knowledge
      args:
        BUILDER_IMAGE: ${BUILDER_IMAGE:-python:3.14-slim-trixie}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-gcr.io/distroless/cc-debian13:nonroot}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.12.5}
    container_name: graph-rag-mcp-knowledge
    depends_on:
      neo4j-knowledge:
        condition: service_healthy
    ports:
      - "127.0.0.1:8765:8765" # loopback-only — see SECURITY.md
    environment:
      NEO4J_URI: "bolt://neo4j-knowledge:7687"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-changeme-local-dev}"
      MCP_HOST: "0.0.0.0" # binds all interfaces inside the container so Docker's
      # port-forwarding can reach it; the host-side publish above still restricts
      # external access to 127.0.0.1.
      MCP_PORT: "8765"
      MCP_AUTH_TOKEN: "${MCP_AUTH_TOKEN:-}"

volumes:
  neo4j_knowledge_data:
  neo4j_knowledge_plugins:

services:
  neo4j:
    image: neo4j:2026.07.1
    container_name: graph-rag-neo4j
    ports:
      - "127.0.0.1:7474:7474" # browser UI
      - "127.0.0.1:7687:7687" # bolt
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-changeme-local-dev}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    volumes:
      - neo4j_data:/data
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  mcp-server:
    build: .
    container_name: graph-rag-mcp
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "127.0.0.1:8765:8765" # loopback-only — see docs/IMPLEMENTATION_PLAN.md Phase 3
    environment:
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-changeme-local-dev}"
      MCP_HOST: "0.0.0.0" # binds all interfaces inside the container so Docker's
      # port-forwarding can reach it; the host-side publish above still restricts
      # external access to 127.0.0.1. Origin/DNS-rebinding checks stay on
      # regardless (see the explicit TransportSecuritySettings in cli.py).
      MCP_PORT: "8765"
      MCP_AUTH_TOKEN: "${MCP_AUTH_TOKEN:-}"

volumes:
  neo4j_data:
  neo4j_plugins:

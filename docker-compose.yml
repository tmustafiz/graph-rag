services:
  neo4j:
    # Overridable so a restricted environment can point at an approved hardened
    # image (e.g. NEO4J_IMAGE=dhi.io/neo4j:2026.07.1, a Chainguard tag, or an
    # internal mirror). See docs/operations.md "Restricted / hardened-registry
    # environments". Must be a Community-edition Neo4j that honours NEO4J_AUTH
    # and (unless you bake plugins in) NEO4J_PLUGINS.
    image: ${NEO4J_IMAGE:-neo4j:2026.07.1}
    container_name: graph-rag-neo4j
    ports:
      - "127.0.0.1:7474:7474" # browser UI
      - "127.0.0.1:7687:7687" # bolt
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-changeme-local-dev}"
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
    volumes:
      - neo4j_data:/data
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  mcp-server:
    build:
      context: .
      args:
        # Override to build against approved hardened base images. Constraints:
        # BUILDER_IMAGE needs a shell + glibc (uv installs a glibc standalone
        # CPython into it); RUNTIME_IMAGE needs glibc + libgcc + libstdc++ +
        # ca-certificates (torch's C++ runtime). See docs/operations.md.
        BUILDER_IMAGE: ${BUILDER_IMAGE:-python:3.14-slim-trixie}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-gcr.io/distroless/cc-debian13:nonroot}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.12.5}
    container_name: graph-rag-mcp
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "127.0.0.1:8765:8765" # loopback-only — see SECURITY.md
    environment:
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-changeme-local-dev}"
      MCP_HOST: "0.0.0.0" # binds all interfaces inside the container so Docker's
      # port-forwarding can reach it; the host-side publish above still restricts
      # external access to 127.0.0.1. Origin/DNS-rebinding checks stay on
      # regardless (see the explicit TransportSecuritySettings in cli.py).
      MCP_PORT: "8765"
      MCP_AUTH_TOKEN: "${MCP_AUTH_TOKEN:-}"

volumes:
  neo4j_data:
  neo4j_plugins:

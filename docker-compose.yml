services:
  neo4j:
    image: neo4j:5.24-community
    container_name: graph-rag-neo4j
    ports:
      - "127.0.0.1:7474:7474" # browser UI
      - "127.0.0.1:7687:7687" # bolt
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-changeme-local-dev}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    volumes:
      - neo4j_data:/data
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # mcp-server:
  #   Added in Phase 3 once the MCP server exists. Will build from this
  #   repo's Dockerfile, depend on neo4j, and publish 127.0.0.1:8765:8765
  #   only (loopback-only — see docs/IMPLEMENTATION_PLAN.md Phase 3).

volumes:
  neo4j_data:
  neo4j_plugins:

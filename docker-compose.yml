services:
  neo4j:
    # Overridable so a restricted environment can point at an approved hardened
    # image (e.g. NEO4J_IMAGE=dhi.io/neo4j:2026 — the Docker Hardened Image,
    # Community edition, same CalVer stream — a Chainguard tag, or an internal
    # mirror). Must be Community edition and honour NEO4J_AUTH. The DHI runtime
    # image ships no wget/curl and no awk, so its entrypoint can neither
    # auto-download NEO4J_PLUGINS nor translate NEO4J_* config env vars into
    # neo4j.conf — set NEO4J_PLUGINS= in .env and preload the jars into the
    # neo4j_plugins volume. See docs/operations.md "Restricted /
    # hardened-registry environments".
    image: ${NEO4J_IMAGE:-neo4j:2026.07.1}
    container_name: graph-rag-neo4j
    ports:
      - "127.0.0.1:7474:7474" # browser UI
      - "127.0.0.1:7687:7687" # bolt
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-changeme-local-dev}"
      # The stock image's entrypoint downloads these on boot. Set NEO4J_PLUGINS=
      # in .env for an image with no wget (e.g. the DHI runtime image) and let
      # the jars already in the neo4j_plugins volume load from the classpath.
      NEO4J_PLUGINS: '${NEO4J_PLUGINS-["apoc", "graph-data-science"]}'
      # Honoured by the stock image; the DHI image (no awk) ignores it, which is
      # fine here — the GDS procedures this project calls don't need it, and the
      # code calls no APOC procedures.
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
    volumes:
      - neo4j_data:/data
      # Mounted at Neo4j's default plugin dir (on the JVM classpath) rather than
      # /plugins, so jars load without an entrypoint-set server.directories.
      # plugins — which the DHI image can't write. The stock image downloads
      # NEO4J_PLUGINS here too when /plugins doesn't exist.
      - neo4j_plugins:/var/lib/neo4j/plugins
    healthcheck:
      # cypher-shell (not wget) so the check works on both the stock and the
      # hardened images; it also verifies Bolt + auth, not just the HTTP port.
      test:
        ["CMD", "cypher-shell", "-u", "${NEO4J_USER:-neo4j}",
         "-p", "${NEO4J_PASSWORD:-changeme-local-dev}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  # Opt-in Neo4j Browser UI, for when NEO4J_IMAGE is a hardened image that ships
  # without it (the Browser 404s: {"code":"Neo.ClientError.Request.Invalid"}).
  # Static files extracted from a stock Neo4j image, served by nginx. Enable it:
  #   docker compose --profile browser up -d
  # then open http://localhost:7475 and connect to bolt://localhost:7687.
  # Not built or started otherwise. See docs/operations.md.
  neo4j-browser:
    profiles: ["browser"]
    build:
      context: ./docker/neo4j-browser
      args:
        NEO4J_BROWSER_SOURCE_IMAGE: ${NEO4J_BROWSER_SOURCE_IMAGE:-neo4j:2026.07.1}
    container_name: graph-rag-neo4j-browser
    ports:
      - "127.0.0.1:7475:8080"
    depends_on:
      - neo4j

  mcp-server:
    build:
      context: .
      args:
        # Override to build against approved hardened base images (e.g.
        # BUILDER_IMAGE=dhi.io/python:3-dev, RUNTIME_IMAGE=dhi.io/python:3).
        # BUILDER is a throwaway stage — needs a shell + glibc, doesn't ship.
        # RUNTIME ships — needs glibc + libgcc + libstdc++ + libssl/libffi/libz
        # + ca-certificates and uid 65532; its own Python (if any) is unused.
        # See docs/operations.md.
        BUILDER_IMAGE: ${BUILDER_IMAGE:-python:3.14-slim-trixie}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-gcr.io/distroless/cc-debian13:nonroot}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.12.5}
    container_name: graph-rag-mcp
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "127.0.0.1:8765:8765" # loopback-only — see SECURITY.md
    environment:
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-changeme-local-dev}"
      MCP_HOST: "0.0.0.0" # binds all interfaces inside the container so Docker's
      # port-forwarding can reach it; the host-side publish above still restricts
      # external access to 127.0.0.1. Origin/DNS-rebinding checks stay on
      # regardless (see the explicit TransportSecuritySettings in cli.py).
      MCP_PORT: "8765"
      MCP_AUTH_TOKEN: "${MCP_AUTH_TOKEN:-}"

volumes:
  neo4j_data:
  neo4j_plugins:

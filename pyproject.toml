[project]
name = "graph-rag"
version = "0.1.0"
description = "Graph RAG knowledge base for coding agents, backed by Neo4j and exposed over MCP"
readme = "README.md"
authors = [
    { name = "tmustafiz", email = "tanvir.mustafiz@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "neo4j>=5.24",
    "typer>=0.12",
    "pydantic-settings>=2.4",
    "pydantic>=2.7",
    "sentence-transformers>=3.0",
    "mcp>=2.1",
    "uvicorn>=0.30",
    "torch>=2.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
pdf = [
    "pymupdf>=1.24",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[project.scripts]
graph-rag = "graph_rag.cli:app"

# Embeddings run on CPU (local dev machines, and the mcp-server container have no
# GPU) — without this, Linux resolves PyPI's default CUDA-enabled torch wheel,
# pulling in several GB of unused nvidia-* packages.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

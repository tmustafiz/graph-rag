[project]
name = "graph-rag"
version = "0.1.0"
description = "Graph RAG knowledge base for coding agents, backed by Neo4j and exposed over MCP"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "tmustafiz", email = "tanvir.mustafiz@gmail.com" }
]
requires-python = ">=3.12"
keywords = [
    "mcp",
    "model-context-protocol",
    "rag",
    "graph-rag",
    "neo4j",
    "knowledge-graph",
    "retrieval",
    "coding-agents",
    "agent-memory",
    "llm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "neo4j>=5.24",
    "typer>=0.12",
    "pydantic-settings>=2.4",
    "pydantic>=2.7",
    "sentence-transformers>=3.0",
    "mcp>=2.1",
    "uvicorn>=0.30",
    "torch>=2.2",
    "pyyaml>=6.0",
    "watchdog>=4.0",
    "fastapi>=0.115",
]

[project.optional-dependencies]
pdf = [
    "pymupdf>=1.24",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/tmustafiz/graph-rag"
Repository = "https://github.com/tmustafiz/graph-rag"
Issues = "https://github.com/tmustafiz/graph-rag/issues"
Changelog = "https://github.com/tmustafiz/graph-rag/blob/main/CHANGELOG.md"

[project.scripts]
graph-rag = "graph_rag.cli:app"

# Embeddings run on CPU (local dev machines, and the mcp-server container have no
# GPU) — without this, Linux resolves PyPI's default CUDA-enabled torch wheel,
# pulling in several GB of unused nvidia-* packages.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

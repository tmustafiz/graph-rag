# Hand-written retrieval regression cases, run via `grag-mcp eval-retrieval`
# against Retriever.search(). `eval-retrieval` first ingests the fixture corpus
# in src/graph_rag/eval/corpus/ (idempotent), so this eval is self-contained and
# does not depend on whatever else you happen to have ingested.
#
# expected_source_path is the path as ingested (repo-root-relative — run
# `make eval` from the repo root). expected_breadcrumb_contains is matched
# case-insensitively as a substring of the hit's section breadcrumb.
- query: "How do I create a new Orchard task queue with the admin CLI?"
  expected_source_path: "src/graph_rag/eval/corpus/task_queue.md"
  expected_breadcrumb_contains: "Creating a queue"
- query: "What retry and backoff behavior does a queue use when a task fails?"
  expected_source_path: "src/graph_rag/eval/corpus/task_queue.md"
  expected_breadcrumb_contains: "Retry and backoff"
- query: "What Orchard terminology and concepts should I understand before starting?"
  expected_source_path: "src/graph_rag/eval/corpus/task_queue.md"
  expected_breadcrumb_contains: "Concepts and terminology"
- query: "How does Orchard encrypt connections between workers and the broker in transit?"
  expected_source_path: "src/graph_rag/eval/corpus/task_queue.md"
  expected_breadcrumb_contains: "Encryption in transit"
- query: "Which environment variables configure an Orchard broker deployment?"
  expected_source_path: "src/graph_rag/eval/corpus/deployment.md"
  expected_breadcrumb_contains: "Environment variables"

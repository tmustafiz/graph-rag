# Hand-written retrieval regression cases, run via `grag-mcp eval-retrieval`
# against the `Retriever` search methods. `eval-retrieval` first ingests the
# fixture corpus in src/graph_rag/eval/corpus/ (idempotent), so this eval is
# self-contained and does not depend on whatever else you happen to have
# ingested.
#
# Each row is an EvalCase:
#   tool:          search (default) | search_code | search_policies
#   query:         the natural-language query
#   top_k:         how many hits to consider (default 5)
#   expect_match:  true (default) — the expectation must be found in the top_k
#                  false          — a negative case: it must NOT be found
#   expected_source_path / expected_breadcrumb_contains   (tool: search)
#   expected_qualified_name_contains                      (tool: search_code)
#   expected_policy_id                                    (tool: search_policies)
# expected_source_path is the path as ingested (repo-root-relative — run from
# the repo root). *_contains fields match case-insensitively as substrings.
# Negative cases target `search`: the code / policy fixtures are too small for
# "absent from the top_k" to mean anything (every node comes back).

# --- tool: search (prose / Markdown) -----------------------------------------
- query: "How do I create a new Orchard task queue with the admin CLI?"
  expected_source_path: "src/graph_rag/eval/corpus/task_queue.md"
  expected_breadcrumb_contains: "Creating a queue"
- query: "What retry and backoff behavior does a queue use when a task fails?"
  expected_source_path: "src/graph_rag/eval/corpus/task_queue.md"
  expected_breadcrumb_contains: "Retry and backoff"
- query: "What Orchard terminology and concepts should I understand before starting?"
  expected_source_path: "src/graph_rag/eval/corpus/task_queue.md"
  expected_breadcrumb_contains: "Concepts and terminology"
- query: "How does Orchard encrypt connections between workers and the broker in transit?"
  expected_source_path: "src/graph_rag/eval/corpus/task_queue.md"
  expected_breadcrumb_contains: "Encryption in transit"
- query: "Which environment variables configure an Orchard broker deployment?"
  expected_source_path: "src/graph_rag/eval/corpus/deployment.md"
  expected_breadcrumb_contains: "Environment variables"
# top_k boundary: a strong case must still rank first when only one hit is kept.
- query: "How does Orchard encrypt worker-to-broker traffic in transit?"
  top_k: 1
  expected_source_path: "src/graph_rag/eval/corpus/task_queue.md"
  expected_breadcrumb_contains: "Encryption in transit"
# negative: a host-sizing question strongly matches deployment.md > Prerequisites,
# so the unrelated queue-retry section must stay out of a tight top_k. ("Absent
# from a wide top_k" is not a reliable assertion against a corpus this small —
# with normalized scores some chunk always looks like a strong hit.)
- query: "What CPU and memory does a deployment host need, and is a database required?"
  expect_match: false
  top_k: 3
  expected_source_path: "src/graph_rag/eval/corpus/task_queue.md"
  expected_breadcrumb_contains: "Retry and backoff"

# --- tool: search_code -----------------------------------------------------
- query: "which function puts a crashed worker's tasks back into circulation"
  tool: search_code
  expected_qualified_name_contains: "scheduler.LeaseScheduler.reclaim_expired_leases"
- query: "how does the scheduler decide a task is poison and should be dead-lettered"
  tool: search_code
  expected_qualified_name_contains: "scheduler.LeaseScheduler.is_poisoned"
- query: "boolean helper that returns whether one lease is past its deadline"
  tool: search_code
  expected_qualified_name_contains: "scheduler.Lease.is_expired"

# --- tool: search_policies -----------------------------------------------
- query: "policy that a queue must reclaim stuck tasks from a dead worker"
  tool: search_policies
  expected_policy_id: "ORCHARD_CUSTOM_1"
- query: "require encrypted TLS connections from workers to the broker"
  tool: search_policies
  expected_policy_id: "ORCHARD_CUSTOM_2"
- query: "cap how many times a task is retried before dead-lettering"
  tool: search_policies
  expected_policy_id: "ORCHARD_CUSTOM_3"

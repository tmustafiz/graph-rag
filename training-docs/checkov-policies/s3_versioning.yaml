metadata:
  id: "CKV2_CUSTOM_3"
  name: "Ensure S3 buckets have versioning enabled"
  category: "BACKUP_AND_RECOVERY"
  severity: "MEDIUM"
  guideline: "Attach an aws_s3_bucket_versioning resource with status set to Enabled."
scope:
  provider: "aws"
definition:
  cond_type: "attribute"
  resource_types:
    - "aws_s3_bucket_versioning"
  attribute: "versioning_configuration.status"
  operator: "equals"
  value: "Enabled"
